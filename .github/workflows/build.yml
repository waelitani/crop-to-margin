name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check the plugin sources
        run: npm run check

      - name: Run the measurement tests
        run: npm test

      - name: Build the .xpi
        run: npm run build

      - name: Check update.json is in step with the build
        run: git diff --exit-code update.json

      - uses: actions/upload-artifact@v4
        with:
          name: crop-to-margin-xpi
          path: build/*.xpi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.xpi
          generate_release_notes: true

      # Last, and after the release exists, because it is the only step that
      # asks whether the outside world agrees with what we just committed.
      # Skipped on pull requests, where a version bump legitimately arrives
      # before the release it names.
      - name: Check the advertised release can actually be downloaded
        if: github.event_name == 'push'
        run: npm run verify
